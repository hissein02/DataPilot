[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot API and analytical engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "duckdb>=1.3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "langchain-openai>=0.3",
  "sqlglot>=26",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
